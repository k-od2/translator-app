<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f7fa;
  margin: 0;
  padding: 20px;
}

.container {
  max-width: 500px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 15px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

h2 {
  text-align: center;
}

textarea {
  width: 100%;
  height: 100px;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid #ccc;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border: none;
  border-radius: 10px;
  background: #4CAF50;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  background: #45a049;
}

.result {
  margin-top: 15px;
  padding: 10px;
  background: #f0f0f0;
  border-radius: 10px;
}
</style>
</head>

<body>

<div class="container">
  <h2>🌍 翻訳アプリ</h2>
  <h3>例文</h3>
<p id="example"></p>

  <textarea id="input" placeholder="日本語を入力..."></textarea>

  <button id="btn">翻訳</button>

  <div class="result">
    <strong>英語:</strong>
    <p id="en"></p>
  </div>

  <div class="result">
    <strong>ドイツ語:</strong>
    <p id="de"></p>
  </div>
</div>

<script>
document.getElementById("input").addEventListener("input", async function() {
  const text = document.getElementById("input").value;

  const res = await fetch("/translate", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({text})
  });

  const data = await res.json();
  
  document.getElementById("en").innerText = data.english;
  document.getElementById("de").innerText = data.german;
  document.getElementById("example").innerText = data.example;
});
</script>

</body>
</html>
